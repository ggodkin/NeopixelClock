[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    fastled/FastLED
    adafruit/Adafruit GFX Library
    marcmerlin/FastLED NeoMatrix
    marcmerlin/Framebuffer GFX
    knolleary/PubSubClient
    bxparks/AceTime
    bxparks/AceTimeClock